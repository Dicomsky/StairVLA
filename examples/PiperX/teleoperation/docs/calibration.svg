<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="hx" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e53935"/></marker>
    <marker id="hy" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d3a"/></marker>
    <marker id="hz" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e6b800"/></marker>
    <marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="420" rx="14" fill="#ffffff"/>
  <line x1="480" y1="30" x2="480" y2="390" stroke="#e3e3e3" stroke-width="2"/>

  <!-- ===================== (a) robot frame ===================== -->
  <text x="30" y="44" font-size="20" font-weight="bold" fill="#222">① PiperX base frame (right-handed)</text>
  <!-- table -->
  <rect x="40" y="318" width="400" height="8" fill="#d9d9d9"/>
  <!-- arm sketch: base, upper arm, forearm, wrist, gripper (facing +X = right) -->
  <rect x="70" y="282" width="70" height="36" rx="6" fill="#4a4f57"/>
  <line x1="105" y1="282" x2="150" y2="165" stroke="#6b717b" stroke-width="18" stroke-linecap="round"/>
  <line x1="150" y1="165" x2="265" y2="150" stroke="#6b717b" stroke-width="14" stroke-linecap="round"/>
  <line x1="265" y1="150" x2="285" y2="205" stroke="#6b717b" stroke-width="12" stroke-linecap="round"/>
  <circle cx="105" cy="282" r="9" fill="#2f333a"/><circle cx="150" cy="165" r="9" fill="#2f333a"/><circle cx="265" cy="150" r="8" fill="#2f333a"/>
  <path d="M276 205 v22 M294 205 v22" stroke="#2f333a" stroke-width="6" stroke-linecap="round"/>
  <!-- base axes at the base -->
  <circle cx="105" cy="300" r="5" fill="#222"/>
  <line x1="105" y1="300" x2="330" y2="300" stroke="#e53935" stroke-width="5" marker-end="url(#hx)"/>
  <line x1="105" y1="300" x2="105" y2="80" stroke="#e6b800" stroke-width="5" marker-end="url(#hz)"/>
  <line x1="105" y1="300" x2="175" y2="245" stroke="#2e9d3a" stroke-width="5" marker-end="url(#hy)"/>
  <text x="338" y="307" font-size="20" font-weight="bold" fill="#e53935">X</text>
  <text x="250" y="346" font-size="14" fill="#444" text-anchor="middle">forward (away from the base)</text>
  <text x="96" y="70" font-size="20" font-weight="bold" fill="#b38f00">Z</text>
  <text x="117" y="70" font-size="14" fill="#444">up (to the sky)</text>
  <text x="182" y="246" font-size="20" font-weight="bold" fill="#2e9d3a">Y</text>
  <text x="182" y="264" font-size="14" fill="#444">left (into the page)</text>
  <text x="30" y="372" font-size="15" fill="#333">Right-hand rule: X forward, Z up, so Y points to the robot's left.</text>
  <text x="30" y="394" font-size="15" fill="#333">Colours everywhere: <tspan fill="#e53935" font-weight="bold">X red</tspan>, <tspan fill="#2e9d3a" font-weight="bold">Y green</tspan>, <tspan fill="#b38f00" font-weight="bold">Z yellow</tspan>.</text>

  <!-- ===================== (b) calibration ===================== -->
  <text x="510" y="44" font-size="20" font-weight="bold" fill="#222">② Calibrate in the headset</text>
  <!-- right controller sketch (side view, ring up, pointing right) -->
  <g transform="translate(600 200)">
    <path d="M-38 -10 C-38 -40 10 -46 40 -30 C62 -18 64 4 46 14 L-18 30 C-34 34 -40 18 -38 -10 z" fill="#3c4048"/>
    <ellipse cx="-14" cy="-30" rx="34" ry="16" fill="none" stroke="#3c4048" stroke-width="9" transform="rotate(-12 -14 -30)"/>
    <circle cx="16" cy="-14" r="5" fill="#9aa0a8"/><circle cx="30" cy="-8" r="5" fill="#9aa0a8"/>
    <!-- controller axes -->
    <circle cx="0" cy="0" r="4" fill="#fff"/>
    <line x1="0" y1="0" x2="150" y2="0" stroke="#e53935" stroke-width="5" marker-end="url(#hx)"/>
    <line x1="0" y1="0" x2="0" y2="-120" stroke="#e6b800" stroke-width="5" marker-end="url(#hz)"/>
    <line x1="0" y1="0" x2="48" y2="-38" stroke="#2e9d3a" stroke-width="5" marker-end="url(#hy)"/>
    <text x="158" y="7" font-size="20" font-weight="bold" fill="#e53935">X</text>
    <text x="-8" y="-130" font-size="20" font-weight="bold" fill="#b38f00">Z</text>
    <text x="54" y="-42" font-size="20" font-weight="bold" fill="#2e9d3a">Y</text>
  </g>
  <!-- robot X reference -->
  <line x1="600" y1="292" x2="750" y2="292" stroke="#555" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#hg)"/>
  <text x="760" y="298" font-size="15" fill="#555">robot X (forward)</text>
  <text x="760" y="252" font-size="14" fill="#555">⇕ same direction</text>

  <text x="510" y="336" font-size="15" fill="#333"><tspan font-weight="bold">1.</tspan> Hold the right controller so its <tspan fill="#e53935" font-weight="bold">red X arrow</tspan> points where the</text>
  <text x="528" y="356" font-size="15" fill="#333">robot's X points (forward, roughly level).</text>
  <text x="510" y="380" font-size="15" fill="#333"><tspan font-weight="bold">2.</tspan> Press <tspan font-weight="bold">left X</tspan>. Done: moving your hand forward now moves</text>
  <text x="528" y="400" font-size="15" fill="#333">the gripper forward.</text>
</svg>
