<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="hx" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e53935"/></marker>
    <marker id="hy" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e9d3a"/></marker>
    <marker id="hz" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e5bd8"/></marker>
    <marker id="hg" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="16" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
  </defs>
  <rect width="960" height="420" rx="14" fill="#ffffff"/>
  <line x1="480" y1="30" x2="480" y2="390" stroke="#e3e3e3" stroke-width="2"/>

  <!-- ===================== (a) robot frame ===================== -->
  <text x="30" y="44" font-size="20" font-weight="bold" fill="#222">① PiperX base frame (right-handed)</text>
  <!-- table -->
  <rect x="40" y="318" width="400" height="8" fill="#d9d9d9"/>
  <!-- arm sketch: base, upper arm, forearm, wrist, gripper (facing +X = right) -->
  <rect x="70" y="282" width="70" height="36" rx="6" fill="#4a4f57"/>
  <line x1="105" y1="282" x2="150" y2="165" stroke="#6b717b" stroke-width="18" stroke-linecap="round"/>
  <line x1="150" y1="165" x2="265" y2="150" stroke="#6b717b" stroke-width="14" stroke-linecap="round"/>
  <line x1="265" y1="150" x2="285" y2="205" stroke="#6b717b" stroke-width="12" stroke-linecap="round"/>
  <circle cx="105" cy="282" r="9" fill="#2f333a"/><circle cx="150" cy="165" r="9" fill="#2f333a"/><circle cx="265" cy="150" r="8" fill="#2f333a"/>
  <path d="M276 205 v22 M294 205 v22" stroke="#2f333a" stroke-width="6" stroke-linecap="round"/>
  <!-- base axes at the base -->
  <circle cx="105" cy="300" r="5" fill="#222"/>
  <line x1="105" y1="300" x2="330" y2="300" stroke="#e53935" stroke-width="5" marker-end="url(#hx)"/>
  <line x1="105" y1="300" x2="105" y2="80" stroke="#1e5bd8" stroke-width="5" marker-end="url(#hz)"/>
  <line x1="105" y1="300" x2="175" y2="245" stroke="#2e9d3a" stroke-width="5" marker-end="url(#hy)"/>
  <text x="338" y="307" font-size="20" font-weight="bold" fill="#e53935">X</text>
  <text x="250" y="346" font-size="14" fill="#444" text-anchor="middle">forward (away from the base)</text>
  <text x="96" y="70" font-size="20" font-weight="bold" fill="#1e5bd8">Z</text>
  <text x="117" y="70" font-size="14" fill="#444">up (to the sky)</text>
  <text x="182" y="246" font-size="20" font-weight="bold" fill="#2e9d3a">Y</text>
  <text x="182" y="264" font-size="14" fill="#444">left (into the page)</text>
  <text x="30" y="372" font-size="15" fill="#333">Right-hand rule: X forward, Z up, so Y points to the robot's left.</text>
  <text x="30" y="394" font-size="15" fill="#333">Colours everywhere: <tspan fill="#e53935" font-weight="bold">X red</tspan>, <tspan fill="#2e9d3a" font-weight="bold">Y green</tspan>, <tspan fill="#1e5bd8" font-weight="bold">Z blue</tspan>.</text>

  <!-- ===================== (b) calibration ===================== -->
  <text x="510" y="44" font-size="20" font-weight="bold" fill="#222">② Align the right controller with the robot</text>
  <!-- right Touch controller, three-quarter view: handle down-left, face with thumbstick and A/B -->
  <g transform="translate(630 212)">
    <g transform="translate(-30 16) scale(0.72)">
    <rect x="-20" y="-6" width="40" height="118" rx="20" fill="#3c4048" transform="rotate(28)"/>
    <ellipse cx="0" cy="0" rx="54" ry="32" fill="#4a4f57"/>
    <ellipse cx="0" cy="-3" rx="46" ry="25" fill="#2f333a"/>
    <circle cx="-18" cy="-4" r="11" fill="#5b616b"/><circle cx="-18" cy="-4" r="6" fill="#80868f"/>
    <circle cx="14" cy="-12" r="7" fill="#6b717b"/><text x="14" y="-8" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">B</text>
    <circle cx="24" cy="5" r="7" fill="#6b717b"/><text x="24" y="9" font-size="9" fill="#fff" text-anchor="middle" font-weight="bold">A</text>
    </g>
    <!-- controller axes, origin on the controller -->
    <circle cx="0" cy="0" r="4" fill="#fff"/>
    <line x1="0" y1="0" x2="140" y2="0" stroke="#e53935" stroke-width="5" marker-end="url(#hx)"/>
    <line x1="0" y1="0" x2="0" y2="-108" stroke="#1e5bd8" stroke-width="5" marker-end="url(#hz)"/>
    <line x1="0" y1="0" x2="50" y2="-40" stroke="#2e9d3a" stroke-width="5" marker-end="url(#hy)"/>
    <text x="148" y="7" font-size="20" font-weight="bold" fill="#e53935">X</text>
    <text x="10" y="-100" font-size="20" font-weight="bold" fill="#1e5bd8">Z</text>
    <text x="56" y="-44" font-size="20" font-weight="bold" fill="#2e9d3a">Y</text>
  </g>
  <text x="565" y="150" font-size="14" fill="#555" text-anchor="middle">right controller</text>
  <!-- robot frame reference (dashed), same orientation as the controller axes -->
  <g transform="translate(830 205)" stroke-dasharray="7 5">
    <line x1="0" y1="0" x2="95" y2="0" stroke="#e53935" stroke-width="3" marker-end="url(#hx)"/>
    <line x1="0" y1="0" x2="0" y2="-95" stroke="#1e5bd8" stroke-width="3" marker-end="url(#hz)"/>
    <line x1="0" y1="0" x2="36" y2="-29" stroke="#2e9d3a" stroke-width="3" marker-end="url(#hy)"/>
  </g>
  <text x="830" y="233" font-size="14" fill="#555" text-anchor="middle">robot axes</text>
  <text x="830" y="251" font-size="14" fill="#555" text-anchor="middle">(from ①)</text>
  <text x="510" y="330" font-size="15" fill="#333"><tspan font-weight="bold">1.</tspan> Hold the right controller so its three arrows point</text>
  <text x="528" y="350" font-size="15" fill="#333">like the robot's: <tspan fill="#e53935" font-weight="bold">X forward</tspan>, <tspan fill="#2e9d3a" font-weight="bold">Y left</tspan>, <tspan fill="#1e5bd8" font-weight="bold">Z up</tspan>.</text>
  <text x="510" y="380" font-size="15" fill="#333"><tspan font-weight="bold">2.</tspan> Press <tspan font-weight="bold">left X</tspan>. Calibration done.</text>
</svg>
