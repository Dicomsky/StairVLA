run_id: pushblock_starvla_gr00t
run_root_dir: ./results/Checkpoints
seed: 42
trackers: [jsonl, wandb]
wandb_entity: null  # set to your W&B entity
wandb_project: StairVLA
is_debug: false

framework:
  name: QwenGR00T
  qwenvl:
    base_vlm: ./playground/Pretrained_models/Qwen3-VL-2B-Instruct
    attn_implementation: sdpa
    vl_hidden_dim: 2048
  action_model:
    action_model_type: DiT-B
    action_hidden_dim: 1024
    hidden_size: 1024
    add_pos_embed: true
    max_seq_len: 1024
    action_dim: 7
    state_dim: 8
    future_action_window_size: 7
    action_horizon: 8
    action_indices: [0, 1, 2, 3, 4, 5, 6, 7]
    past_action_window_size: 0
    repeated_diffusion_steps: 8
    noise_beta_alpha: 1.5
    noise_beta_beta: 1.0
    noise_s: 0.999
    num_timestep_buckets: 1000
    num_inference_timesteps: 4
    num_target_vision_tokens: 32
    diffusion_model_cfg:
      cross_attention_dim: 2048
      dropout: 0.2
      final_dropout: true
      interleave_self_attention: true
      norm_type: "ada_norm"
      num_layers: 16
      output_dim: 1024
      positional_embeddings: null
  reduce_in_full_precision: true

datasets:
  vlm_data:
    dataset_py: vlm_datasets
    dataformat: llava_json
    dataset_use: sharegpt4v_coco
    eval_dataset: sharegpt4v_coco
    data_flatten: false
    base_interval: 2
    max_pixels: 307200
    min_pixels: 784
    model_max_length: 2048
    model_type: qwen3vl
    per_device_batch_size: 8

  vla_data:
    dataset_py: lerobot_datasets
    data_root_dir: playground/Datasets
    data_mix: pushblock
    lerobot_version: v3.0
    action_type: eef_delta
    action_mode: abs
    action_statistics_modes: [abs]
    sequential_step_sampling: false
    CoT_prompt: "Your task is {instruction}. To identify the key objects for your task. Locate their bounding boxes in [x1,y1,x2,y2] format."
    CoT_answer: bbox
    default_image_resolution: [3, 224, 224]
    image_size: [224, 224]
    per_device_batch_size: 8
    load_all_data_for_training: true
    include_state: true
    obs: ["image_0", "image_1"]
    video_backend: torchvision_av
    observation_indices: [0]
    state_indices: [0]
    action_indices: [0, 1, 2, 3, 4, 5, 6, 7]

trainer:
  epochs: 100
  max_train_steps: 10000
  num_warmup_steps: 1000
  save_interval: 5000
  keep_last_n: 3
  eval_interval: 500
  learning_rate:
    base: 2.5e-05
    qwen_vl_interface: 1.0e-05
    action_model: 1.0e-04
  lr_scheduler_type: cosine_with_min_lr
  scheduler_specific_kwargs:
    min_lr: 1.0e-06
  freeze_modules: ''
  loss_scale:
    vla: 1.0
    vlm: 0.0
  max_grad_norm: 1.0
  warmup_ratio: 0.05
  weight_decay: 0.0
  logging_frequency: 50
  gradient_clipping: 1.0
  gradient_accumulation_steps: 1

  optimizer:
    name: AdamW
    betas: [0.9, 0.95]
    eps: 1.0e-08
    weight_decay: 1.0e-08

  is_resume: false
  resume_epoch: null
  resume_step: null
  pretrained_checkpoint: null
  reload_modules: qwen_vl_interface,action_model
  enable_gradient_checkpointing: true
  enable_mixed_precision_training: true
